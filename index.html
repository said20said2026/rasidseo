<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RasidSEO - فاحص أخطاء وسيو المواقع والمدونات</title>
    <meta name="description" content="منصة احترافية شاملة لفحص وتدقيق أخطاء المواقع والمدونات، وتحليل السيو التقني، وفحص علامات الميتا، وهيكل العناوين، وسرعة الصفحة، والأمان مع توصيات إصلاح ذكية." />
    <meta property="og:title" content="RasidSEO - فاحص أخطاء وسيو المواقع والمدونات" />
    <meta property="og:description" content="منصة احترافية شاملة لفحص وتدقيق أخطاء المواقع والمدونات، وتحليل السيو التقني، وفحص علامات الميتا، وهيكل العناوين، وسرعة الصفحة، والأمان مع توصيات إصلاح ذكية." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('rasid_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || ((!savedTheme || savedTheme === 'system') && systemDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var savedLang = localStorage.getItem('rasid_selected_language') || 'ar';
          var rtlLangs = ['ar', 'fa', 'ur', 'he'];
          if (rtlLangs.indexOf(savedLang) !== -1) {
            document.documentElement.dir = 'rtl';
          } else {
            document.documentElement.dir = 'ltr';
          }
          document.documentElement.lang = savedLang;
        } catch (e) {}
      })();
    </script>
    <style>
      .goog-te-banner-frame.skiptranslate, .goog-te-banner-frame, iframe.goog-te-banner-frame {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
      .goog-tooltip, .goog-tooltip:hover {
        display: none !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
      }
      #goog-gt-tt {
        display: none !important;
      }
      #google_translate_element {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <!-- Google Translate Element for 100% full-site translation across all 40 world languages -->
    <div id="google_translate_element" style="display:none;position:absolute;top:-9999px;left:-9999px;visibility:hidden;width:0;height:0;"></div>
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        if (window.google && window.google.translate) {
          try {
            new window.google.translate.TranslateElement({
              pageLanguage: 'ar',
              includedLanguages: 'ar,en,es,fr,de,zh-CN,ja,ko,tr,ru,pt,it,nl,fa,ur,hi,id,ms,vi,th,pl,sv,no,da,fi,el,cs,hu,ro,uk,iw,bn,tl,sw,sr,hr,sk,bg,az',
              autoDisplay: false
            }, 'google_translate_element');
          } catch(e) {}
        }
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
